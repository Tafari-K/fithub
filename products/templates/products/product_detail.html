{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card">

        {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
        {% endif %}

        <div class="card-body">
            <h2>{{ product.name }}</h2>
            <p class="text-muted">£{{ product.price }}</p>

            {% if product.is_premium %}
                <span class="badge bg-warning text-dark">Premium Product</span>
            {% endif %}

            <p class="mt-3">{{ product.description }}</p>

            <form action="{% url 'add_to_cart' product.id %}" method="post" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="quantity">Quantity:</label>
                    <input type="number" name="quantity" value="1" min="1" class="form-control" style="max-width: 120px;">
                </div>
                <button type="submit" class="btn btn-success">Add to Cart</button>
            </form>

            <a href="{% url 'product_list' %}" class="btn btn-secondary mt-3">
                Back to Products
            </a>
        </div>
    </div>
</div>
{% endblock %}
