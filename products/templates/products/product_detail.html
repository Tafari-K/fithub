{% extends "base.html" %}

{% block content %}

<section class="container py-5">
    <div class="row g-5">

        <!-- IMAGE -->
        <div class="col-md-6">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            {% elif product.image_url %}
                <img src="{{ product.image_url }}" alt="{{ product.name }}">
            {% else %}
                <img src="https://via.placeholder.com/300x300?text=No+Image" alt="No image available">
            {% endif %}
        </div>

        <!-- DETAILS -->
        <div class="col-md-6">

            <h1 class="fw-bold mb-3">{{ product.name }}</h1>

            <p class="fs-4 fw-semibold">£{{ product.price }}</p>

            {% if product.is_premium %}
                <span class="badge bg-warning text-dark mb-3">Premium Product</span>
            {% endif %}

            <p class="mt-3">{{ product.description }}</p>

            <!-- ADD TO CART -->
            <form action="{% url 'add_to_cart' product.id %}" method="post" class="mt-4">
                {% csrf_token %}

                <div class="mb-3" style="max-width: 150px;">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" value="1" min="1" class="form-control">
                </div>

                <button type="submit" class="btn btn-orange w-100">
                    Add to Cart
                </button>
            </form>

            <!-- BACK -->
            <a href="{% url 'product_list' %}" class="btn btn-outline-dark mt-3 w-100">
                Back to Products
            </a>

        </div>

    </div>
</section>

{% endblock %}
