{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-7">
            <div class="card p-4 shadow-sm border-0 rounded-4">
                <h4 class="mb-3">Your Details</h4>

                <form method="post" id="payment-form">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="mb-3">
                        <label for="payment-element" class="form-label">Card Details</label>
                        <div id="payment-element" class="mb-2"></div>
                        <div id="payment-errors" class="text-danger small"></div>
                    </div>

                    <button type="submit" class="btn btn-success" id="submit-button">
                        Pay £{{ total }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block postloadjs %}
{{ block.super }}
<script>
    const stripePublicKey = "{{ stripe_public_key|escapejs }}";
    const clientSecret = "{{ client_secret|escapejs }}";
    const totalAmount = "{{ total|escapejs }}";
</script>
<script src="{% static 'checkout/js/stripe_elements.js' %}"></script>
{% endblock %}
