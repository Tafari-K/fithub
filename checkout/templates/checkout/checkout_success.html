{% extends "base.html" %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="card p-4 shadow-sm border-0 rounded-4">
        <h2 class="mb-3">Order Successful</h2>
        <p>Thank you for your order, {{ order.full_name }}.</p>
        <p>Your order number is <strong>{{ order.id }}</strong>.</p>
        <p>Total paid: <strong>£{{ order.order_total }}</strong></p>

        <a href="{% url 'product_list' %}" class="btn btn-primary mt-3">
            Continue Shopping
        </a>
    </div>
</div>
{% endblock %}
