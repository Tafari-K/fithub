{% extends "base.html" %}

{% block content %}
<section class="checkout-success-section py-5">
  <div class="container">
    <div class="success-card mx-auto text-center p-4 p-md-5">

      {% if confirmation %}

        <h2 class="mb-3 text-success">Confirm Your Email</h2>

        <p class="lead">
          Please confirm that this email belongs to you.
        </p>

        <form method="post" action="{% url 'account_confirm_email' confirmation.key %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-success mt-3">
            Confirm Email
          </button>
        </form>

      {% else %}

        <h2 class="mb-3 text-danger">Invalid or Expired Link</h2>
        <p>This confirmation link is no longer valid.</p>

        <a href="{% url 'account_login' %}" class="btn btn-outline-danger mt-3">
          Back to Login
        </a>

      {% endif %}

    </div>
  </div>
</section>
{% endblock %}
