{% extends "base.html" %}

{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 p-4 p-md-5 text-center">
                    <h1 class="h2 fw-bold mb-3">Log Out</h1>
                    <p class="text-muted mb-4">
                        Are you sure you want to log out of your FITHUB account?
                    </p>

                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-orange w-100 py-2">
                            Confirm Logout
                        </button>
                    </form>

                    <a href="{% url 'home' %}" class="btn btn-outline-dark w-100 py-2 mt-3">
                        Cancel
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
