<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block corejs %}
    <script src="https://js.stripe.com/v3/"></script>
    {% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">FitHub</a>
        <div>
            <a class="nav-link text-white d-inline" href="{% url 'product_list' %}">Products</a>
        </div>
        <div>
            <a class="nav-link text-white d-inline" href="{% url 'view_cart' %}">
                Cart <span class="badge bg-light text-dark rounded-pill">{{ cart_item_count }}</span>
            </a>
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}

{% block postloadjs %}
{% endblock %}

</body>
</html>
