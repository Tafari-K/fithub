{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Delete Post</h1>

    <div class="card p-3">
        <p>Are you sure you want to delete this post?</p>

        <h4>{{ post.title }}</h4>
        <p>{{ post.content }}</p>

        <form method="POST">
            {% csrf_token %}
            <button class="btn btn-danger w-100">Yes, Delete</button>
            <a href="{% url 'community_home' %}" class="btn btn-outline-dark w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
