{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Edit Comment</h1>

    <div class="card p-3">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'community_home' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
