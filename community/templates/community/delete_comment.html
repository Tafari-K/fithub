{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Delete Comment</h1>

    <div class="card p-3">
        <p>Are you sure you want to delete this comment?</p>

        <p>{{ comment.content }}</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'community_home' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
